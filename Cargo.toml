[package]
name = "orange_name"
version = "0.1.0"
edition = "2024"
authors = ["Caleb Couch <caleb@orange.me>"]
description = "Decentralized Identity"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/orange_name.git"

[dependencies]
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
bitcoin_hashes = "0.16.0"
chacha20-poly1305 = "0.1.2"
chrono = {version="0.4.41", features = ["serde"]}
secp256k1 = { version = "0.31.1", features = ["serde", "global-context", "rand"] }
serde = {version = "1.0.219", features = ["derive"]}
serde_with = "3.14.0"
url = "2.5.7"
hex = "0.4.3"
serde_json = "1.0.145"
